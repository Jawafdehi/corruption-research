    <!--noscript--><noscript><style>.nojs{max-width:760px;margin:0 auto;padding:24px 18px;font:16px/1.5 system-ui,sans-serif;color:#1d2533}.nojs h2{font-size:24px}.nojs li{margin:6px 0}.nojs ul{padding-left:18px}</style><section class="nojs" lang="en"><h2>Where accountability leaks</h2><p>This page also reads without JavaScript: the main figures and every leak are below.</p><ol><li><b>Complaints:</b> 33,519<ul><li><b>A person who complains cannot follow what happens to the complaint</b> There is no public way to look up a complaint's status on the CIAA website (checked 10 November 2026).</li></ul></li><li><b>Sent for full investigation:</b> 722<ul><li><b>Most complaints are closed before a full investigation, and no reason is given</b> In 2082/83, 6 in 10 of the complaints the CIAA decided were closed without a full investigation, and no reason was given.</li><li><b>Thousands of complaints wait, and nobody says for how long</b> At the end of 2082/83, 8,019 of the complaints on the CIAA's books (about 1 in 5) were still waiting, and how long they have waited is not published.</li></ul></li><li><b>Cases filed in court:</b> 175<ul><li><b>After a full investigation, the CIAA now shelves most cases instead of charging them</b> In 2081/82, 75% of the CIAA's decisions after a full investigation closed the case.</li></ul></li><li><b>Special Court: cases with a conviction (estimate):</b> ≈107<ul><li><b>In about 4 in 10 cases the CIAA files in the Special Court after a full investigation, every defendant is acquitted</b> Of the 2,649 CIAA cases the Special Court has decided so far, 39% ended with every defendant acquitted.</li><li><b>When the court acquits, it usually says the charge was not proved, or was not a crime; it sometimes says the CIAA charged selectively</b> In 13 of 31 judgments with acquittals that we read (from a random sample of 42), the Special Court said the evidence did not prove the charge.</li><li><b>The public cannot see which defendants were convicted and which were cleared</b> For 3,038 of the 8,846 defendant records in CIAA cases filed from 2069/70 to 2082/83 and decided by 8 October 2026, the court's website does not say who was convicted.</li></ul></li><li><b>Supreme Court: convictions that stand (estimate):</b> ≈63<ul><li><b>About 1 in 5 acquittals never gets a government appeal, and no reason is published</b> Of the 1,010 acquittals old enough for an appeal to have been filed, 21.7% (219) have no government appeal on record, and no reason is published.</li><li><b>The public cannot follow a case from trial to appeal</b> Even after linking by hand so far, 726 of the 4,430 corruption appeals could not be traced to any Special Court trial.</li><li><b>Appeals go one way: convictions are often overturned, acquittals almost never</b> When a convicted person appeals, the Supreme Court fully overturns the conviction in 41% of trials; when the government appeals an acquittal, the acquittal is overturned in only 1%.</li><li><b>Overturned convictions mostly fail on how the case was investigated and proved</b> In 7 of 16 overturned convictions that we read (a sample), the Supreme Court pointed to flaws in the CIAA's investigation.</li><li><b>An appeal takes about four years, and more than one in four takes over six</b> Of corruption appeals registered 2064–2075 BS (2008–2018), counting those still pending, half have taken more than 4.1 years to be decided.</li><li><b>About 3 in 4 scheduled hearings do not happen, mostly for the court's own reasons</b> Of the 27,855 times so far that a corruption appeal was put on the Supreme Court's hearing list, 77% ended without the bench taking it up.</li><li><b>730 pending appeals have never been listed for a hearing</b> Of the 1,890 corruption appeals now pending at the Supreme Court, 730 (39%) have never once been listed for a hearing.</li><li><b>After the September 2025 arson, 865 pending appeals still have no file, and decisions have fallen by more than half</b> When the court's pages were read on 1–2 November 2026, almost 14 months after the fire of 9 September 2025, 865 of the corruption appeals pending at the Supreme Court were still marked “file destroyed, not recovered”.</li></ul></li><li><b>Money recovered:</b> ?<ul><li><b>No one publishes how much is recovered from corruption judgments</b> In 2080/81 and 2081/82, outside one or two courts, about 1 in 9 rupees of the courts' fine ledger (all kinds of case) was disposed of in a year; for corruption alone, no figure exists.</li></ul></li></ol><p><b>Where it ends: of 33,519 complaints, about 63 (0.19%), fewer than 2 in 1,000, end in a conviction that still stands after the Supreme Court. An estimate, from each stage's rate applied in turn.</b></p></section><section class="nojs" lang="ne"><h2>जवाफदेहिता कहाँ चुहिन्छ</h2><p>यो पाना JavaScript बिना पनि पढ्न सकिन्छ: मुख्य अंक र सबै चुहावट तल छन्।</p><ol><li><b>उजुरी:</b> ३३,५१९<ul><li><b>उजुरी गर्ने व्यक्तिले आफ्नो उजुरीको के भयो भनेर पछ्याउन सक्दैन।</b> अख्तियारको वेबसाइटमा उजुरीको स्थिति सार्वजनिक रूपमा हेर्ने कुनै उपाय छैन (२०८३ कार्तिक २४ मा जाँच गरिएको)।</li></ul></li><li><b>विस्तृत अनुसन्धानमा पठाइएका:</b> ७२२<ul><li><b>धेरैजसो उजुरी विस्तृत अनुसन्धान नगरी, कारण नखुलाई तामेलीमा राखिन्छन्।</b> २०८२/८३ मा अख्तियारले निर्णय गरेका उजुरीमध्ये १० मा ६ उजुरी विस्तृत अनुसन्धान नगरी, कारण नखुलाई तामेलीमा राखिए।</li><li><b>हजारौं उजुरी पर्खिरहेका छन्। कति समयदेखि भन्ने कसैले बताउँदैन।</b> २०८२/८३ को अन्त्यमा अख्तियारमा रहेका उजुरीमध्ये ८,०१९ (करिब ५ मा १) अझै पर्खिरहेका थिए; कति समयदेखि पर्खिरहेका छन् भन्ने प्रकाशित छैन।</li></ul></li><li><b>अदालतमा दायर मुद्दा:</b> १७५<ul><li><b>विस्तृत अनुसन्धान सकिएका धेरैजसो उजुरी पनि अख्तियारले मुद्दा दायर नगरी तामेलीमा राख्छ।</b> २०८१/८२ मा विस्तृत अनुसन्धानपछि अख्तियारले गरेका निर्णयमध्ये ७५% मा उजुरी तामेलीमा राखियो।</li></ul></li><li><b>विशेष अदालत: कसुर ठहर भएका मुद्दा (अनुमान):</b> ≈१०७<ul><li><b>अख्तियारले विस्तृत अनुसन्धान गरी विशेष अदालतमा दायर गरेका मुद्दामध्ये करिब १० मा ४ मा सबै प्रतिवादीले सफाइ पाउँछन्।</b> विशेष अदालतले अहिलेसम्म फैसला गरेका अख्तियारका २,६४९ मुद्दामध्ये ३९% मा सबै प्रतिवादीले सफाइ पाए।</li><li><b>अदालतले सफाइ दिँदा प्रायः अभियोग पुष्टि नभएको वा कसुर नै नभएको भन्छ। कहिलेकाहीँ अख्तियारले छानीछानी मुद्दा चलाएको पनि भन्छ।</b> नमुनाका रूपमा छानिएका ४२ फैसलामध्ये कारण खुलेका ३१ मा, १३ वटामा विशेष अदालतले प्रमाणले अभियोग पुष्टि नगरेको भन्यो।</li><li><b>सर्वसाधारणले कुन प्रतिवादी कसुरदार ठहरिए र कसले सफाइ पाए भन्ने हेर्न सक्दैनन्।</b> २०६९/७० देखि २०८२/८३ सम्म दायर भई २०८३ असोज २२ सम्म फैसला भएका अख्तियारका मुद्दाका ८,८४६ प्रतिवादी अभिलेखमध्ये ३,०३८ को हकमा अदालतको वेबसाइटले कसलाई कसुर ठहर भयो भनेर देखाउँदैन।</li></ul></li><li><b>सर्वोच्च अदालत: कायम रहने कसुर ठहर (अनुमान):</b> ≈६३<ul><li><b>करिब ५ मा १ सफाइमा सरकारले पुनरावेदन नै गर्दैन। कारण सार्वजनिक गरिँदैन।</b> पुनरावेदन गर्ने समय नाघिसकेका १,०१० सफाइमध्ये २१.७% (२१९) मा कुनै सरकारी पुनरावेदन अभिलेखमा भेटिएन; कारण प्रकाशित छैन।</li><li><b>सर्वसाधारणले कुनै मुद्दालाई विशेष अदालतदेखि पुनरावेदनसम्म पछ्याउन सक्दैनन्।</b> अहिलेसम्म हातैले खोज्दा पनि ४,४३० भ्रष्टाचार पुनरावेदनमध्ये ७२६ विशेष अदालतको कुनै मुद्दासँग जोड्न सकिएन।</li><li><b>पुनरावेदनको नतिजा एकतर्फी छ: कसुर ठहर धेरै उल्टिन्छन्, सफाइ लगभग कहिल्यै उल्टिँदैन।</b> कसुरदार ठहरिएका प्रतिवादीले पुनरावेदन गर्दा ४१% मुद्दामा कसुर ठहर पूरै उल्टियो; सरकारले सफाइविरुद्ध पुनरावेदन गर्दा १% मा मात्र सफाइ उल्टियो।</li><li><b>उल्टिएका कसुर ठहरमा प्रायः अनुसन्धान र प्रमाणकै कमजोरी कारण देखिन्छ।</b> नमुनाका रूपमा पढिएका १६ उल्टिएका कसुर ठहरमध्ये ७ वटामा सर्वोच्च अदालतले अनुसन्धानको कमजोरी औंल्यायो।</li><li><b>पुनरावेदनको फैसला हुन करिब चार वर्ष लाग्छ। चारमध्ये एकभन्दा बढीमा छ वर्षभन्दा बढी लाग्छ।</b> २०६४–२०७५ (सन् २००८–२०१८) मा दर्ता भएका भ्रष्टाचार पुनरावेदनमध्ये, विचाराधीनसमेत गन्दा, आधाको फैसला हुन ४.१ वर्षभन्दा बढी लागेको छ।</li><li><b>पेशी तोकिएका ४ मध्ये करिब ३ पटक सुनुवाइ हुँदैन। प्रायः कारण अदालतकै हुन्छ।</b> अहिलेसम्म सर्वोच्च अदालतमा भ्रष्टाचार पुनरावेदनको पेशी तोकिएका २७,८५५ पटकमध्ये ७७% मा इजलासले पुनरावेदनको सुनुवाइ नै गरेन।</li><li><b>७३० विचाराधीन पुनरावेदन एक पटक पनि पेशीमा चढेका छैनन्।</b> सर्वोच्च अदालतमा हाल विचाराधीन १,८९० भ्रष्टाचार पुनरावेदनमध्ये ७३० (३९%) एक पटक पनि पेशीमा चढेका छैनन्।</li><li><b>२०८२ भदौ २४ को आगजनीपछि ८६५ विचाराधीन पुनरावेदनको मिसिल छैन। फैसला हुने दर आधाभन्दा बढीले घटेको छ।</b> २०८२ भदौ २४ को आगजनीको करिब १४ महिनापछि पनि सर्वोच्च अदालतमा विचाराधीन ८६५ भ्रष्टाचार पुनरावेदनको मिसिल “नष्ट, फेला नपरेको” भनी जनिएको थियो।</li></ul></li><li><b>रकम असुली:</b> ?<ul><li><b>भ्रष्टाचारका फैसलाबाट कति रकम असुली भयो भन्ने कसैले प्रकाशित गर्दैन।</b> २०८०/८१ र २०८१/८२ मा, एक-दुई अदालत बाहेक, अदालतको दण्ड-जरिवाना लगतको (सबै प्रकारका मुद्दा) करिब ९ मा १ रुपैयाँ वर्षमा फर्छ्यौट भयो; भ्रष्टाचारको असुलीको छुट्टै तथ्यांक नै छैन।</li></ul></li></ol><p><b>अन्त्यमा: ३३,५१९ उजुरीमध्ये करिब ६३ (०.१९%), अर्थात् १,००० मा २ भन्दा कम, मा मात्र सर्वोच्च अदालतपछि पनि कसुर ठहर कायम रहन्छ। यो हरेक चरणको दर क्रमशः लागू गरेर निकालिएको अनुमान हो।</b></p></section></noscript><!--/noscript-->
