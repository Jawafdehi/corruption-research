name: Deploy dashboard

# Builds the Corruption Accountability dashboard and deploys it to Cloudflare as a
# static-asset Worker, served at https://research.jawafdehi.org
#
# The data file is REGENERATED here from `dataset/` on every run rather than taken
# from the commit. The copy in the repo is a convenience so `npm run dev` works
# without Python; what gets published is always derived from the dataset as it
# stands at this commit, so the published figures cannot lag the data behind them.
#
# Was GitHub Pages until 2026-10-09. Pages cannot serve a single-page app honestly:
# a deep link has no file on disk, so it 404s, and the standard workaround serves the
# app out of 404.html — which returns the right page with an HTTP 404 status. The
# Worker's `not_found_handling = "single-page-application"` returns a real 200.

on:
  push:
    branches: [main]
    paths:
      - "dataset/**"
      - "ciaa-vs-register/data/**"
      - "corpus_data.py"
      - "gen_site_data.py"
      - "site/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

# Never let two deploys race; the later commit should win.
concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://research.jawafdehi.org
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the provenance panel dates each dataset file by the last
          # commit that touched it. The default shallow clone has only one commit,
          # so every file would be dated today — the same false "it's current"
          # that using mtime here produced.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: site/requirements.txt

      - name: Install data dependencies
        run: pip install -r site/requirements.txt

      - name: Derive the dashboard data from dataset/
        run: python gen_site_data.py

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install site dependencies
        working-directory: site
        run: npm ci

      - name: Type-check
        working-directory: site
        run: npm run typecheck

      - name: Build
        working-directory: site
        run: npm run build

      - name: Deploy to Cloudflare
        working-directory: site
        # A token scoped to Workers Scripts: Edit on this account and nothing else.
        # It cannot touch DNS, and it cannot mint further tokens.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
